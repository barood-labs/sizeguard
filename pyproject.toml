[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sizeguard"
version = "0.1.0"
description = "Before you click buy: position size, liquidation, funding cost, and fee drag for crypto perps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "barood-labs" }]
keywords = ["crypto", "perps", "position-size", "liquidation", "funding", "risk"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.scripts]
sizeguard = "sizeguard.cli:main"

[project.urls]
Homepage = "https://github.com/barood-labs/sizeguard"
Repository = "https://github.com/barood-labs/sizeguard"

[tool.setuptools.packages.find]
include = ["sizeguard*"]
